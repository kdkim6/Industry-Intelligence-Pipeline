    <button class="btn big" data-nav="5" type="button">Continue to Export →</button>
  </div>`;
}

function execCard(k,v,cand){
  return `<div class="exec-card"><div class="k">${k}</div><div class="v">${esc(String(v))}</div>${cand?citeSpan(cand):`<span class="tag gap">not found</span>`}</div>`;
}
function citeSpan(c){ return `<span class="cite" data-cid="${c.id}">[${esc(c.sourceId)}, p. ${c.page}]</span>`; }

function fmtSize(item){
  const f = item.fields;
  if(f.amount && f.unit) return `$${f.amount} ${f.unit}${f.year?` (${f.year})`:""}`;
  return "See excerpt — amount not auto-parsed";
}
function fmtGrowth(item){
  const f = item.fields;
  if(f.rate) return `${f.rate}%${f.horizon?` (${f.horizon})`:""}`;
  return "See excerpt — rate not auto-parsed";
}

function renderSizeGrowthTable(sizeItems, growthItems){
  if(sizeItems.length===0 && growthItems.length===0){
    return `<p class="no-candidates">Not found in uploaded sources.</p>`;
  }
  let discrepancy = "";
  if(sizeItems.length>1){
    const amounts = sizeItems.map(i=>i.fields.amount).filter(Boolean);
    const distinct = [...new Set(amounts)];
    if(distinct.length>1){
      discrepancy = `<div class="discrepancy"><b>Source discrepancy:</b> uploaded sources report different industry-size figures (${sizeItems.map(i=>`${esc(i.sourceId)}: $${esc(i.fields.amount||"?")} ${esc(i.fields.unit||"")}`).join("; ")}). This may reflect differing industry definitions, geographic scope, or measurement dates between reports.</div>`;
    }
  }
  return `${discrepancy}<div class="table-wrap"><table>
    <thead><tr><th>Metric</th><th>Value</th><th>Year</th><th>Type</th><th>Citation</th></tr></thead>
    <tbody>
    ${sizeItems.map(i=>`<tr><td>Industry size/revenue</td><td>${fmtSize(i)}</td><td>${esc(i.fields.year||"—")}</td><td><span class="tag fact">fact</span></td><td>${citeSpan(i)}</td></tr>`).join("")}
    ${growthItems.map(i=>`<tr><td>5-yr growth / CAGR</td><td>${fmtGrowth(i)}</td><td>${esc(i.fields.horizon||"—")}</td><td><span class="tag fact">fact</span></td><td>${citeSpan(i)}</td></tr>`).join("")}
    </tbody></table></div>
  <p class="small">Interpretation <span class="tag interp">interp</span>: ${
    growthItems.length ? "Uploaded sources indicate the industry is in a growth phase over the stated horizon; direction of the reported rate (positive vs. negative) should be checked against the excerpt above before citing in written work." :
    "Growth direction (growing / flat / declining) is not asserted because no confirmed growth-rate evidence was found."
  }</p>`;
}

function renderCompetitorTable(items){
  if(items.length===0) return `<p class="no-candidates">Not found in uploaded sources — no competitor/market-share evidence detected.</p>`;
  return `<div class="table-wrap"><table>
    <thead><tr><th>Company</th><th>Market share</th><th>Confidence</th><th>Year</th><th>Limitations</th><th>Citation</th></tr></thead>
    <tbody>
    ${items.map(i=>{
      const verified = i.fields.shareStatus==="verified" && i.fields.share;
      return `<tr>
      <td>${esc(i.fields.company)||"Not identified — verify manually"}</td>
      <td>${verified ? i.fields.share+"%" : "<em>Unable to verify market share</em>"}</td>
      <td><span class="tag ${i.fields.confidence==='high'?'fact':(i.fields.confidence==='medium'?'calc':'gap')}">${esc(i.fields.confidence||"low")}</span></td>
      <td>${esc(i.fields.year||"—")}</td>
      <td class="small">${i.warning ? `<span style="color:var(--red);">⚠ ${esc(i.warningText)}</span>` : "Surrounding text explicitly ties this percentage to market/industry share and to the named company."}</td>
      <td>${citeSpan(i)}</td>
    </tr>`;}).join("")}
    </tbody></table></div>
  <p class="small">Extraction method <span class="tag interp">method</span>: named companies are taken from the report’s Companies section, then matched to the report’s Company Market Share table. Ranges such as 0–2.5% are preserved as estimates rather than converted to false precision. If the table cannot be read from the PDF text layer, add it manually from the chart/table with its page citation.</p>`;
}

function renderQualTable(items, fieldKeys, labels){
  if(items.length===0) return `<p class="no-candidates">Not found in uploaded sources.</p>`;
  return `<div class="table-wrap"><table><thead><tr>${labels.map(l=>`<th>${l}</th>`).join("")}<th>Why it matters</th><th>Citation</th></tr></thead><tbody>${items.map(i=>`<tr>${fieldKeys.map(fk=>`<td>${esc(i.fields[fk]||"—")}</td>`).join("")}<td class="small"><span class="tag ${i.kind==='interp'?'interp':'fact'}">${i.kind==='interp'?'interp':'fact'}</span> ${genericWhy(i)}</td><td>${citeSpan(i)}</td></tr>`).join("")}</tbody></table></div>`;
}
function genericWhy(item){ return esc(item.fields.why || `The selected passage directly supports this signal; verify the full excerpt in the Evidence panel.`); }
function supplyAssessment(items){
  if(items.length===0) return {level:"Not found",frag:"Not found"};
  const assessments=items.map(i=>i.fields.assessment).filter(Boolean);
  const hasTariff=items.some(i=>(i.fields.label||"").toLowerCase().includes("tariff") || (i.excerpt||"").toLowerCase().includes("tariff"));
  const hasBroad=items.some(i=>(i.fields.label||"").toLowerCase().includes("broad upstream"));
  if(hasTariff&&hasBroad) return {level:"Moderate fragility",frag:"Broad supplier base, but meaningful imported-input/tariff exposure"};
  if(assessments.length) return {level:assessments[0],frag:assessments.join("; ")};
  return {level:"Evidence reviewed",frag:"See cited passages"};
}
function renderSupplyChain(items){
  if(items.length===0) return `<p class="no-candidates">Not found in uploaded sources.</p>`;
  const a=supplyAssessment(items);
  return `${renderQualTable(items,["label"],["Supply-chain evidence"])}<p class="small"><b>Overall assessment:</b> ${esc(a.level)} <span class="tag interp">interp</span> — ${esc(a.frag)}. This synthesis is based only on the checked supply-chain excerpts above.</p>`;
}
function renderSingleQual(items){
  if(items.length===0) return `<p class="no-candidates">Not found in uploaded sources.</p>`;
  const i=items[0];
  return `<p><b>${esc(i.fields.label||"See excerpt")}</b> ${citeSpan(i)} <span class="tag ${i.kind==='interp'?'interp':'fact'}">${i.kind==='interp'?'interpretation':'source fact'}</span></p><p class="small">${i.fields.why?esc(i.fields.why)+"<br/>":""}<b>Supporting evidence:</b> “${esc(i.excerpt)}”</p>`;
}

function renderGapsTable(gaps){
  if(gaps.length===0) return `<p class="small">No outstanding evidence gaps were identified in the uploaded sources.</p>`;
  return `<div class="table-wrap"><table>
    <thead><tr><th>Missing information</th><th>Why it could not be determined</th><th>What would resolve it</th><th></th></tr></thead>
    <tbody>
    ${gaps.map((g,idx)=>`<tr><td>${esc(g.missing)}</td><td class="small">${esc(g.why)}</td><td class="small">${esc(g.resolve)}</td>
      <td>${g.custom? `<button class="btn ghost removeGap no-print" data-idx="${idx-autoGaps().length}" type="button" style="padding:4px 8px;">×</button>`:""}</td></tr>`).join("")}
    </tbody></table></div>`;
}

function renderSourceRegister(){
  return `<div class="table-wrap"><table>
    <thead><tr><th>ID</th><th>Title</th><th>Publisher</th><th>Year</th><th>Type</th><th>Pages</th><th>URL</th></tr></thead>
    <tbody>
    ${state.sources.map(s=>`<tr><td><span class="badge">${s.id}</span></td><td>${esc(s.title)}</td><td>${esc(s.publisher)}</td><td>${esc(s.year||"—")}</td><td>${esc(s.type)}</td><td>${s.pageCount}</td><td class="small">${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a>`:"—"}</td></tr>`).join("")}
    </tbody></table></div>`;
}

/* ---------- STEP 5: Export ---------- */
function stepExport(){
  return `
  <div class="card">
    <span class="section-label">Step 6</span>
    <h2>Export the brief</h2>
    <p class="desc">Copy the brief as Markdown for a paper, download the structured JSON for an appendix or further processing, or print/save as PDF directly from this page.</p>
    <div class="btn-row">
      <button class="btn big" id="copyMdBtn" type="button">Copy Markdown</button>
      <button class="btn big ghost" id="downloadJsonBtn" type="button">Download JSON</button>
      <button class="btn big ghost" id="printBtn" type="button">Print / Save as PDF</button>
    </div>
    <p class="small" id="exportStatus"></p>
  </div>
  <div class="card">
    <span class="section-label">Preview</span>
    <h2>Markdown preview</h2>
    <textarea id="mdPreview" style="min-height:340px;font-family:'IBM Plex Mono',monospace;font-size:12px;" readonly>${esc(buildMarkdown())}</textarea>
  </div>
  <div class="btn-row"><button class="btn ghost" data-nav="4" type="button">← Back to Brief</button></div>`;
}

/* ============================= MARKDOWN / JSON BUILDERS ============================= */
function buildMarkdown(){
  const c = state.candidates;
  const included = key => c[key].filter(x=>x.included);
  const gaps = [...autoGaps(), ...state.extraGaps];
  const n = state.naics;
  let md = `# Industry Intelligence Brief\n\n`;
  md += `**Company:** ${state.company}  \n**Competitive market:** ${analysisMarket()}  \n**NAICS:** ${n.code} — ${n.title}  \n**Analysis date:** ${state.briefDate}\n\n`;
  md += `## NAICS Classification\n\n- **Selected code:** ${n.code} — ${n.title}\n- **Census definition:** ${n.definitionRationale||n.censusDef} ${n.citation.label}\n- **Company evidence:** ${n.companyEvidenceStatement||""} ${n.businessCitation?n.businessCitation.label:""}\n- **Neighboring code considered:** ${n.neighborCode} — ${n.neighborTitle}\n- **Why rejected:** ${n.neighborRejection} ${n.neighborCitation.label}\n\n`;
  md += `## 1. Industry Size & Growth\n\n`;
  included("size").forEach(i=> md += `- ${fmtSize(i)} [${i.sourceId}, p. ${i.page}]\n`);
  included("growth").forEach(i=> md += `- Growth: ${fmtGrowth(i)} [${i.sourceId}, p. ${i.page}]\n`);
  if(included("size").length===0 && included("growth").length===0) md += `- Not found in uploaded sources.\n`;
  md += `\n## 2. Competitive Landscape\n\n`;
  included("competitors").forEach(i=>{
    const shareTxt = (i.fields.shareStatus==="verified" && i.fields.share) ? i.fields.share+"%" : "Unable to verify market share";
    const warnTxt = i.warning ? ` (⚠ ${i.warningText})` : "";
    md += `- ${i.fields.company||"Not identified"} — ${shareTxt} (confidence: ${i.fields.confidence})${warnTxt} [${i.sourceId}, p. ${i.page}]\n`;
  });
  if(included("competitors").length===0) md += `- Not found in uploaded sources.\n`;
  const qualSection = (title,key) => {
    md += `\n## ${title}\n\n`;
    const items = included(key);
    if(items.length===0){ md+= `- Not found in uploaded sources.\n`; return; }
    items.forEach(i=> md += `- ${i.fields.label||i.excerpt.slice(0,60)} [${i.sourceId}, p. ${i.page}]\n`);
  };
  qualSection("3. Regulatory & Compliance Pressure","regulatory");
  qualSection("4. Supply Chain","supply");
  qualSection("5. Customer Structure","customer");
  qualSection("6. Biggest Five-Year Trend","trend");
  qualSection("7. Biggest Threat","threat");
  md += `\n## Evidence Gaps & Limitations\n\n| Missing information | Why it could not be determined | What would resolve it |\n|---|---|---|\n`;
  if(gaps.length===0) md += `| None identified | All required signals have cited evidence. | — |\n`;
  else gaps.forEach(g=> md += `| ${g.missing} | ${g.why} | ${g.resolve} |\n`);
  md += `\n## Sources\n\n`;
  state.sources.forEach(s=> md += `- [${s.id}] ${s.publisher || "Unknown publisher"} — ${s.title}${s.year?", "+s.year:""} (${s.filename}, ${s.pageCount} pages)\n`);
  md += `\n## Methodology\n\nNAICS classification is based on the analyst-supplied operating model plus company-specific evidence and is matched to Census definitions; Census/NAICS files are excluded from all non-NAICS signals. Industry evidence is extracted using report-section structure where available, with keyword-only matches left unchecked for human review. Source facts and analyst interpretations are labeled separately, chart/table evidence can be added manually, and unresolved requirements are reported as evidence gaps rather than guessed.\n`;
  return md;
}

function buildJson(){
  const c = state.candidates;
  const included = key => c[key].filter(x=>x.included).map(i=>({
    excerpt:i.excerpt, fields:i.fields, citations:[`${i.sourceId}, p. ${i.page}`]
  }));
  const gaps = [...autoGaps(), ...state.extraGaps];
  return {
    company: state.company,
    competitive_market: analysisMarket(),
    industry: state.naics.title,
    naics: {
      code: state.naics.code,
      title: state.naics.title,
      rationale: state.naics.rationale,
      neighboring_code: state.naics.neighborCode,
      rejection_rationale: state.naics.neighborRejection,
      citations: [state.naics.citation.label, ...(state.naics.businessCitation?[state.naics.businessCitation.label]:[]), state.naics.neighborCitation.label]
    },
    industry_size: {items: included("size"), citations: included("size").flatMap(i=>i.citations)},
    growth_trajectory: {items: included("growth"), citations: included("growth").flatMap(i=>i.citations)},
    competitors: c.competitors.filter(x=>x.included).map(i=>({
      company: i.fields.company || "Not identified",
      market_share_percent: (i.fields.shareStatus==="verified" && i.fields.share) ? i.fields.share : null,
      market_share_status: i.fields.shareStatus,
      confidence: i.fields.confidence,
      year: i.fields.year || null,
      excerpt: i.excerpt,
      validation_warning: i.warning ? (i.warningText||true) : null,
      citations: [`${i.sourceId}, p. ${i.page}`]
    })),
    regulatory_pressure: included("regulatory"),
    supply_chain: {items: included("supply"), citations: included("supply").flatMap(i=>i.citations)},
    customers: {items: included("customer"), citations: included("customer").flatMap(i=>i.citations)},
    five_year_trend: included("trend")[0] || {note:"Not found in uploaded sources"},
    biggest_threat: included("threat")[0] || {note:"Not found in uploaded sources"},
    evidence_gaps: gaps,
    sources: state.sources.map(s=>({id:s.id,title:s.title,publisher:s.publisher,year:s.year,type:s.type,filename:s.filename,url:s.url,pageCount:s.pageCount})),
    analysis_date: state.briefDate,
    generated_by: "Industry Intelligence Pipeline (client-side, section-aware evidence extraction with analyst confirmation)"
  };
}

/* ============================= EVIDENCE MODAL ============================= */
function openEvidence(cid){
  let found=null, sig=null;
  for(const s of SIGNALS){ const hit = state.candidates[s.key].find(c=>c.id===cid); if(hit){found=hit; sig=s; break;} }
  if(!found){
    if(state.naics.citation && state.naics.citation.excerpt){ found = state.naics.citation; }
  }
  const src = found ? state.sources.find(s=>s.id===found.sourceId) : null;
  document.getElementById("evidenceBody").innerHTML = `
    <p><b>Signal:</b> ${sig?sig.label:"NAICS classification"}</p>
    <p><b>Source:</b> ${src? `${esc(src.id)} — ${esc(src.title)} (${esc(src.publisher)}${src.year?", "+esc(src.year):""})` : "Built-in NAICS Reference Library"}</p>
    <p><b>Page:</b> ${found && found.page ? found.page : "n/a"}</p>
    <div class="evidence-excerpt">${esc(found ? found.excerpt : "")}</div>`;
  document.getElementById("evidenceModalBack").classList.add("open");
}
document.getElementById("evidenceClose").addEventListener("click",()=>document.getElementById("evidenceModalBack").classList.remove("open"));
document.getElementById("evidenceModalBack").addEventListener("click",e=>{ if(e.target.id==="evidenceModalBack") e.currentTarget.classList.remove("open"); });

/* ============================= EVENT WIRING ============================= */
function wireEvents(){
  document.getElementById("themeToggle")?.addEventListener("click", ()=>{
    const html = document.documentElement;
    html.setAttribute("data-theme", html.getAttribute("data-theme")==="dark" ? "light" : "dark");
  });

  document.querySelectorAll("[data-nav]").forEach(b=> b.addEventListener("click", ()=> setStep(parseInt(b.dataset.nav))));
  document.querySelectorAll(".step-btn").forEach(b=> b.addEventListener("click", ()=>{ if(!b.disabled) setStep(parseInt(b.dataset.step)); }));

  // Step 0
  document.getElementById("companyInput")?.addEventListener("input", e=>{ state.company = e.target.value; state.naics=null; state.candidates=null; });
  document.getElementById("companyDescription")?.addEventListener("input", e=>{ state.companyDescription=e.target.value; state.naics=null; state.candidates=null; });
  document.getElementById("startBtn")?.addEventListener("click", ()=> setStep(1));

  // Step 1
  document.getElementById("naicsCode")?.addEventListener("input", e=> state.naics.code = e.target.value);
  document.getElementById("naicsTitle")?.addEventListener("input", e=> state.naics.title = e.target.value);
  document.getElementById("naicsRationale")?.addEventListener("input", e=> state.naics.rationale = e.target.value);
  document.getElementById("naicsNeighborCode")?.addEventListener("input", e=> state.naics.neighborCode = e.target.value);
  document.getElementById("naicsNeighborTitle")?.addEventListener("input", e=> state.naics.neighborTitle = e.target.value);
  document.getElementById("naicsRejection")?.addEventListener("input", e=> state.naics.neighborRejection = e.target.value);
  document.getElementById("recomputeNaics")?.addEventListener("click", ()=>{ state.naics = computeNaics(); render(); });
  document.getElementById("censusQuickUpload")?.addEventListener("change", async e=>{
    const f = e.target.files[0]; if(!f) return;
    await handleFileUpload(f,"Census/NAICS","U.S. Census Bureau");
    state.naics = computeNaics();
    state.candidates = null;
    render();
  });

  // Step 2 uploads
  const bindUpload = (id, category, publisher)=>{
    document.getElementById(id)?.addEventListener("change", async e=>{
      const files = Array.from(e.target.files);
      const statusEl = document.getElementById("uploadStatus");
      if(statusEl) statusEl.textContent = "Processing "+files.length+" file(s)…";
      for(const f of files){ await handleFileUpload(f, category, publisher); }
      state.naics = computeNaics();
      state.candidates = null;
      if(statusEl) statusEl.textContent = "";
      render();
    });
  };
  bindUpload("uploadIbis","IBISWorld","IBISWorld");
  bindUpload("uploadMR","MarketResearch.com","MarketResearch.com");
  bindUpload("uploadCensus","Census/NAICS","U.S. Census Bureau");
  bindUpload("uploadSupp","Supplemental","");

  document.querySelectorAll(".src-field").forEach(inp=>{
    inp.addEventListener("input", e=>{
      const src = state.sources.find(s=>s.id===e.target.dataset.src);
      if(src) src[e.target.dataset.field] = e.target.value;
    });
  });
  document.querySelectorAll(".removeSrc").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.sources = state.sources.filter(s=>s.id!==btn.dataset.src);
      state.naics = computeNaics(); state.candidates=null;
      render();
    });
  });

  // Step 3
  document.getElementById("generateBtn")?.addEventListener("click", ()=>{
    state.candidates = extractCandidates();
    render();
  });
  document.getElementById("regenerateBtn")?.addEventListener("click", ()=>{
    state.candidates = extractCandidates();
    render();
  });
  document.querySelectorAll(".candChk").forEach(chk=>{
    chk.addEventListener("change", e=>{
      const wrap = e.target.closest(".candidate");
      const sigKey = wrap.dataset.sigkey, cid = wrap.dataset.cid;
      const cand = state.candidates[sigKey].find(c=>c.id===cid);
      cand.included = e.target.checked;
    });
  });
  document.querySelectorAll(".candidate .fields input").forEach(inp=>{
    inp.addEventListener("input", e=>{
      const wrap = e.target.closest(".candidate");
      const sigKey = wrap.dataset.sigkey, cid = wrap.dataset.cid;
      const cand = state.candidates[sigKey].find(c=>c.id===cid);
      cand.fields[e.target.dataset.f] = e.target.value;
      if(sigKey==="competitors" && e.target.dataset.f==="share"){
        // a manual edit to the share value is an explicit human confirmation
        cand.fields.shareStatus = e.target.value.trim() ? "verified" : "unable";
        if(e.target.value.trim()) cand.warning = false;
      }
    });
  });
  document.querySelectorAll(".manualExcerpt").forEach(el=>el.addEventListener("input",e=>{
    const wrap=e.target.closest(".candidate"), cand=state.candidates[wrap.dataset.sigkey].find(c=>c.id===wrap.dataset.cid); cand.excerpt=e.target.value;
  }));
  document.querySelectorAll(".manualPage").forEach(el=>el.addEventListener("change",e=>{
    const wrap=e.target.closest(".candidate"), cand=state.candidates[wrap.dataset.sigkey].find(c=>c.id===wrap.dataset.cid); cand.page=parseInt(e.target.value||"1",10)||1; render();
  }));
  document.querySelectorAll(".manualSrc").forEach(el=>el.addEventListener("change",e=>{
    const wrap=e.target.closest(".candidate"), cand=state.candidates[wrap.dataset.sigkey].find(c=>c.id===wrap.dataset.cid); cand.sourceId=e.target.value; render();
  }));
  document.querySelectorAll(".addCandidate").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const sigKey=btn.dataset.sig; const firstSrc=primaryIndustrySource()||state.sources[0];
      const fields = sigKey==="competitors" ? {company:"",share:"",shareStatus:"unable",confidence:"manual",year:""} :
        sigKey==="size" ? {amount:"",unit:"billion (USD)",year:""} :
        sigKey==="growth" ? {rate:"",horizon:""} :
        sigKey==="regulatory" ? {label:"",direction:""} : {label:""};
      state.candidates[sigKey].push({id:uid(),sourceId:firstSrc?firstSrc.id:"S1",page:1,keyword:"manual chart/table/text evidence",excerpt:"Paste the exact supporting excerpt, or describe the chart/table value exactly as shown.",included:true,fields,manual:true,confidence:"manual",kind:"fact",warning:false,warningText:""});
      render();
    });
  });

  // Step 4
  document.querySelectorAll(".cite").forEach(el=> el.addEventListener("click", ()=> openEvidence(el.dataset.cid)));
  document.getElementById("addGapBtn")?.addEventListener("click", ()=>{
    const m = document.getElementById("newGapMissing").value.trim();
    const w = document.getElementById("newGapWhy").value.trim();
    const r = document.getElementById("newGapResolve").value.trim();
    if(!m) return;
    state.extraGaps.push({missing:m, why:w||"Not specified.", resolve:r||"Not specified.", custom:true});
    render();
  });
  document.querySelectorAll(".removeGap").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.idx);
      if(idx>=0){ state.extraGaps.splice(idx,1); render(); }
    });
  });

  // Step 5
  document.getElementById("copyMdBtn")?.addEventListener("click", async ()=>{
    await navigator.clipboard.writeText(buildMarkdown());
    document.getElementById("exportStatus").textContent = "Markdown copied to clipboard.";
  });
  document.getElementById("downloadJsonBtn")?.addEventListener("click", ()=>{
    const blob = new Blob([JSON.stringify(buildJson(), null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = (state.company||"industry-brief").replace(/\s+/g,"_")+"_intelligence_brief.json";
    document.body.appendChild(a); a.click(); a.remove();
    document.getElementById("exportStatus").textContent = "JSON downloaded.";
  });
  document.getElementById("printBtn")?.addEventListener("click", ()=>{
    setStep(4);
    setTimeout(()=>window.print(), 150);
  });
}

/* ============================= INIT ============================= */
render();
</script>
