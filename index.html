<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industry Intelligence Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
<style>
:root{
  --bg:#F4F5F7;
  --panel:#FFFFFF;
  --ink:#151A23;
  --ink-soft:#4B5566;
  --line:#DDE1E7;
  --line-soft:#E8EAEE;
  --navy:#1E3A5F;
  --navy-deep:#132A45;
  --amber:#B9791F;
  --amber-bg:#FBF1DF;
  --green:#2E6B4F;
  --green-bg:#E7F2EC;
  --red:#A6402A;
  --red-bg:#FBEAE4;
  --radius:10px;
}
:root[data-theme="dark"]{
  --bg:#11151C;
  --panel:#181D26;
  --ink:#EDF0F4;
  --ink-soft:#A7B0BF;
  --line:#2A303C;
  --line-soft:#232935;
  --navy:#6C93BE;
  --navy-deep:#8FB0D6;
  --amber:#E0AC55;
  --amber-bg:#3A2E15;
  --green:#7ABE9C;
  --green-bg:#153224;
  --red:#E08A6F;
  --red-bg:#3A2019;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
code,.mono,.badge,.cite,.tag,input[type=text].mono-field{font-family:"IBM Plex Mono",monospace;}
a{color:var(--navy);}
h1,h2,h3,h4{font-weight:600;letter-spacing:-0.01em;margin:0 0 6px 0;}
.app{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}
.masthead{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:22px;flex-wrap:wrap;}
.masthead .brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:38px;height:38px;border-radius:8px;background:linear-gradient(155deg,var(--navy),var(--navy-deep));display:flex;align-items:center;justify-content:center;color:#fff;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;flex:none;}
.brand h1{font-size:19px;margin:0;}
.brand p{margin:2px 0 0;color:var(--ink-soft);font-size:13px;}

/* Stepper */
.stepper{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;overflow-x:auto;margin-bottom:22px;}
.step-btn{flex:1;min-width:118px;display:flex;flex-direction:column;gap:2px;padding:9px 12px;border-radius:8px;border:none;background:transparent;color:var(--ink-soft);cursor:pointer;text-align:left;font-family:inherit;}
.step-btn .n{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.03em;}
.step-btn .t{font-size:13px;font-weight:500;color:var(--ink);}
.step-btn.active{background:var(--navy);}
.step-btn.active .n,.step-btn.active .t{color:#fff;}
.step-btn.done .n{color:var(--green);}
.step-btn:disabled{opacity:.45;cursor:not-allowed;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;}
.card h2{font-size:16px;}
.card > .desc{color:var(--ink-soft);font-size:13.5px;margin-bottom:16px;max-width:70ch;}
.section-label{display:inline-block;font-size:11px;letter-spacing:.04em;color:var(--navy);background:var(--line-soft);border-radius:5px;padding:3px 8px;margin-bottom:10px;font-weight:600;}

label.field-label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
input[type=text],input[type=url],input[type=number],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);
  font-family:inherit;font-size:13.5px;
}
textarea{resize:vertical;min-height:56px;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy);outline-offset:1px;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.row > *{flex:1;min-width:180px;}

button{font-family:inherit;cursor:pointer;}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:600;}
.btn:hover{background:var(--navy-deep);}
.btn.big{padding:14px 26px;font-size:15px;border-radius:9px;}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
.btn.ghost:hover{background:var(--line-soft);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}

.upload-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:6px;}
.upload-box{border:1.5px dashed var(--line);border-radius:9px;padding:16px;text-align:center;background:var(--bg);}
.upload-box h4{font-size:13px;margin-bottom:4px;}
.upload-box p{font-size:11.5px;color:var(--ink-soft);margin:0 0 10px;}
.upload-box input[type=file]{font-size:11.5px;width:100%;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
th{font-size:11px;text-transform:none;color:var(--ink-soft);font-weight:600;border-bottom:1.5px solid var(--line);}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}

.badge{display:inline-flex;align-items:center;gap:4px;background:var(--navy);color:#fff;border-radius:5px;padding:2px 7px;font-size:11px;font-weight:600;}
.badge.outline{background:transparent;border:1px solid var(--navy);color:var(--navy);}
.cite{display:inline-flex;background:var(--amber-bg);color:var(--amber);border:1px solid #E8CE9E;border-radius:5px;padding:1px 7px;font-size:11.5px;cursor:pointer;font-weight:500;}
:root[data-theme="dark"] .cite{border-color:#5b4623;}
.cite:hover{filter:brightness(0.95);text-decoration:underline;}
.tag{font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--line-soft);color:var(--ink-soft);}
.tag.fact{background:var(--green-bg);color:var(--green);}
.tag.calc{background:var(--amber-bg);color:var(--amber);}
.tag.interp{background:var(--line-soft);color:var(--ink-soft);}
.tag.gap{background:var(--red-bg);color:var(--red);}

.candidate{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:var(--bg);}
.candidate .head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.candidate .excerpt{font-size:12.5px;color:var(--ink-soft);font-style:italic;margin:6px 0;border-left:2px solid var(--line);padding-left:10px;}
.candidate label.chk{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:500;cursor:pointer;}
.candidate .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:8px;}
.candidate .fields label{font-size:11px;color:var(--ink-soft);display:block;margin-bottom:3px;}
.candidate .fields input{padding:6px 8px;font-size:12.5px;}
.no-candidates{font-size:13px;color:var(--ink-soft);padding:10px;background:var(--red-bg);border-radius:7px;border:1px solid #EAD2C7;}

.exec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:10px 0 4px;}
.exec-card{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:14px 16px;}
.exec-card .k{font-size:11px;color:var(--ink-soft);margin-bottom:4px;}
.exec-card .v{font-size:15px;font-weight:600;margin-bottom:6px;}

.progressbar{height:6px;background:var(--line-soft);border-radius:4px;overflow:hidden;margin-top:4px;}
.progressbar > div{height:100%;background:var(--navy);}

.modal-back{position:fixed;inset:0;background:rgba(10,14,20,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
.modal-back.open{display:flex;}
.modal{background:var(--panel);border-radius:12px;max-width:560px;width:100%;max-height:80vh;overflow-y:auto;padding:22px 24px;border:1px solid var(--line);}
.modal h3{font-size:15px;}
.modal .close{float:right;background:none;border:none;color:var(--ink-soft);font-size:20px;line-height:1;cursor:pointer;}
.evidence-excerpt{background:var(--amber-bg);border:1px solid #E8CE9E;border-radius:7px;padding:12px 14px;font-size:13px;margin-top:10px;font-style:italic;}
:root[data-theme="dark"] .evidence-excerpt{border-color:#5b4623;}

.gap-toolbar{display:flex;gap:8px;margin-bottom:10px;}
.small{font-size:12px;color:var(--ink-soft);}
.hr{border:none;border-top:1px solid var(--line-soft);margin:18px 0;}
.brief-header{border-bottom:2px solid var(--navy);padding-bottom:14px;margin-bottom:18px;}
.brief-header .co{font-size:23px;font-weight:700;}
.brief-header .meta{color:var(--ink-soft);font-size:13px;margin-top:4px;}
.brief-section h3{font-size:15px;margin-top:26px;border-bottom:1px solid var(--line-soft);padding-bottom:8px;}
.discrepancy{background:var(--red-bg);border:1px solid #EAD2C7;border-radius:7px;padding:12px 14px;margin:10px 0;font-size:13px;}
.discrepancy b{color:var(--red);}

footer.note{margin-top:26px;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line-soft);padding-top:14px;}
@media print{
  .stepper,.btn-row,.no-print{display:none !important;}
  body{background:#fff;}
  .card{border:none;padding:0;margin-bottom:14px;}
  .app{max-width:100%;padding:0;}
}
::selection{background:var(--amber-bg);}
</style>
</head>
<body>
<div class="app" id="app"></div>

<div class="modal-back" id="evidenceModalBack">
  <div class="modal">
    <button class="close" id="evidenceClose">&times;</button>
    <h3>Evidence</h3>
    <div id="evidenceBody"></div>
  </div>
</div>

<script>
/* ============================= STATE ============================= */
const STEPS = ["Company","Industry / NAICS","Sources","Analyze","Industry Brief","Export"];

const state = {
  step: 0,
  company: "Chipotle Mexican Grill",
  companyDescription: "Fast-casual restaurant chain where customers order or select meals before eating; food is available for dine-in, takeout, and delivery.",
  sources: [],           // {id,title,publisher,year,filename,type,category,url,pageCount,pages:[{num,text}],fullText}
  naicsMode: "auto",     // auto | manual
  naics: null,           // computed or manual object
  candidates: null,      // {size:[...], growth:[...], ...}
  extraGaps: [],         // user-added gap rows
  briefGenerated: false,
  briefDate: null
};

let nextSourceNum = 1;

/* ===================== NAICS REFERENCE LIBRARY =====================
   Short, factual definitional excerpts adapted from the U.S. Census
   Bureau's 2022 NAICS Manual (public reference descriptions). Used as
   a fallback citation only when the user has not uploaded their own
   Census/NAICS documentation. */
const NAICS_REF = {
  "722513": {
    title: "Limited-Service Restaurants",
    def: "Establishments primarily engaged in providing food services (except snack and nonalcoholic beverage bars) where patrons generally order or select items and pay before eating. Food and drink may be consumed on premises, taken out, or delivered. Includes fast-food and fast-casual/counter-service restaurants.",
    keywords: ["fast casual","quick service","counter service","order at the counter","pay before eating","limited service","fast food","drive-thru","drive thru","qsr","order counter","self-serve line","assembly-line"]
  },
  "722511": {
    title: "Full-Service Restaurants",
    def: "Establishments primarily engaged in providing food services to patrons who order and are served while seated (table/wait service) and pay after eating.",
    keywords: ["full service","full-service","waiter","waitress","table service","fine dining","sit-down","pay after eating","reservation"]
  },
  "722515": {
    title: "Snack and Nonalcoholic Beverage Bars",
    def: "Establishments primarily engaged in preparing and/or serving a specialty snack (such as ice cream, frozen yogurt, cookies, or popcorn) or nonalcoholic beverages (such as coffee, juice, or smoothies) for consumption on or near the premises; patrons order and pay before eating.",
    keywords: ["snack bar","ice cream","frozen yogurt","coffee shop","juice bar","smoothie","cafe","donut shop"]
  },
  "722320": {
    title: "Caterers",
    def: "Establishments primarily engaged in providing single-event-based food services for events with a specific date, location, and clientele, either at the customer's site or a special event site rather than a stand-alone facility.",
    keywords: ["catering","caterer","event-based food","banquet service"]
  }
};

/* ============================= SIGNAL DEFINITIONS ============================= */
const SIGNALS = [
  {key:"size", label:"Industry Size & 5-Year Growth", short:"Industry size", keywords:["industry revenue","market size","estimated at $","total industry revenue","industry is valued","market value","industry generates","estimated to be worth","industry size"]},
  {key:"growth", label:"Growth Trajectory", short:"5-year growth", keywords:["cagr","annual growth rate","forecast to grow","expected to grow","annualized growth","growth rate of","compound annual","five-year","5-year","projected to increase","projected to decline"]},
  {key:"competitors", label:"Major Competitors & Market Share", short:"Market leader", keywords:["market share","% of industry revenue","leading company","largest player","top competitor","industry leader","accounts for approximately","dominant player","market leader"]},
  {key:"regulatory", label:"Regulatory / Compliance Pressure", short:"Regulatory pressure", keywords:["minimum wage","food safety","fda","labor law","osha","regulation","compliance","labeling requirement","environmental regulation","health code","paid sick leave","data privacy","overtime rule","immigration enforcement","tariff"]},
  {key:"supply", label:"Supply Chain Concentration / Fragility", short:"Supply chain", keywords:["supplier","supply chain","commodity price","sourcing","vendor","logistics","input cost","shortage","avocado","beef price","ingredient cost","distribution center","single-source","concentration of suppliers"]},
  {key:"customer", label:"Customer Concentration / Fragmentation", short:"Customer structure", keywords:["consumer","customer base","demographic","millennial","gen z","loyalty program","business customers","b2b","distributor","government contract","household","foot traffic"]},
  {key:"trend", label:"Biggest 5-Year Trend", short:"Biggest trend", keywords:["trend","emerging","shift toward","growing demand","increasingly popular","digital ordering","delivery growth","plant-based","health-conscious","automation","mobile app","loyalty app","ghost kitchen"]},
  {key:"threat", label:"Biggest Threat", short:"Biggest threat", keywords:["threat","risk factor","headwind","challenge","competitive pressure","disruption","margin pressure","labor shortage","inflation","input cost volatility","litigation risk"]}
];

/* ============================= UTIL ============================= */
function esc(s){return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function uid(){return Math.random().toString(36).slice(2,10);}
function allSourceText(){return state.sources.map(s=>s.fullText).join("\n\n");}

function moneyGuess(text){
  const m = text.match(/\$\s?([\d,]+(?:\.\d+)?)\s?(billion|million|bn|mm|b\b|m\b)/i);
  if(!m) return {amount:"",unit:""};
  let unit = m[2].toLowerCase();
  unit = (unit[0]==='b') ? "billion (USD)" : "million (USD)";
  return {amount: m[1].replace(/,/,""), unit};
}
function pctGuess(text){
  const m = text.match(/(\d{1,3}(?:\.\d+)?)\s?%/);
  return m ? m[1] : "";
}
function yearGuess(text){
  const m = text.match(/\b(20[0-3]\d)\b/);
  return m ? m[1] : "";
}

function normText(text){
  return (text||"").replace(/[–—−]/g,"-").replace(/\s+/g," ").trim();
}
function escRe(text){ return (text||"").replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function sourceMeta(src){ return normText(`${src.category||""} ${src.type||""} ${src.publisher||""} ${src.title||""} ${src.filename||""}`).toLowerCase(); }
function normalizeSourceMetadata(src){
  const file=(src.filename||"").toLowerCase();
  const first=firstPagesText(src,6).toLowerCase();
  const combined=`${file} ${first}`;

  // Recognize the specific report families from their own title pages / filenames,
  // so metadata stays correct even if a file is dropped into the wrong upload box.
  if(file.includes("2022_naics_manual") || first.includes("north american industry classification system")){
    src.title="2022 NAICS Manual";
    src.publisher="U.S. Census Bureau";
    src.year="2022";
    src.type="Census/NAICS";
    src.category="Census/NAICS";
  } else if(file.includes("od4305") || (first.includes("ibisworld") && first.includes("mexican restaurants in the us"))){
    src.title="OD4305 Mexican Restaurants in the US";
    src.publisher="IBISWorld";
    src.year=src.year||"2026";
    src.type="IBISWorld";
    src.category="IBISWorld";
  } else if(file.includes("72211a") || (first.includes("ibisworld") && first.includes("chain restaurants in the us"))){
    src.title="72211A Chain Restaurants in the US";
    src.publisher="IBISWorld";
    src.year=src.year||"2026";
    src.type="IBISWorld";
    src.category="IBISWorld";
  } else if(file.includes("2025usim") || first.includes("barnes reports") || first.includes("2025 u.s. industry & market report")){
    src.title="2025 U.S. Industry & Market Report — Fast Food Restaurants Industry (NAICS 722513)";
    src.publisher="Barnes Reports";
    src.year="2025";
    src.type="Supplemental industry report";
    src.category="Supplemental";
  } else if(file.includes("statista") || first.includes("chipotle mexican grill") && first.includes("statista")){
    src.title="Chipotle Mexican Grill — Statista Dossier";
    src.publisher="Statista";
    src.year=src.year||"2025";
    src.type="Supplemental company/competitor source";
    src.category="Supplemental";
  }
  return src;
}
function isNaicsSource(src){
  const m = sourceMeta(src);
  return (src.category==="Census/NAICS") || m.includes("census/naics") || m.includes("naics manual") || m.includes("north american industry classification system");
}
function evidenceSources(){ return state.sources.filter(s=>!isNaicsSource(s)); }
function companyTerms(){
  const full = normText(state.company).toLowerCase();
  const first = full.split(" ")[0] || "";
  return [...new Set([full, first.length>=4?first:""]).values()].filter(Boolean);
}
function firstPagesText(src, n=10){ return normText((src.pages||[]).slice(0,n).map(p=>p.text).join(" ")); }
function companyRelevanceScore(src){
  if(isNaicsSource(src)) return -999;
  const first = firstPagesText(src,10).toLowerCase();
  const allMeta = sourceMeta(src);
  const terms = companyTerms();
  let score = 0;
  if((src.publisher||"").toLowerCase().includes("ibisworld") || (src.category||"").toLowerCase().includes("ibisworld")) score += 15;
  if((src.publisher||"").toLowerCase().includes("marketresearch") || (src.category||"").toLowerCase().includes("marketresearch")) score += 2;
  if(terms[0] && first.includes(terms[0])) score += 8;
  if(terms[1] && first.includes("companies") && first.includes(terms[1])) score += 10;
  if(terms[1] && allMeta.includes(terms[1])) score += 2;
  if(allMeta.includes("chain restaurants") && terms[1] && !first.includes(terms[1])) score -= 6;
  return score;
}
function primaryIndustrySource(){
  const pool = evidenceSources().slice().sort((a,b)=>companyRelevanceScore(b)-companyRelevanceScore(a));
  return pool[0] || null;
}
function orderedEvidenceSources(){
  const primary = primaryIndustrySource();
  return evidenceSources().slice().sort((a,b)=>{
    if(primary && a.id===primary.id) return -1;
    if(primary && b.id===primary.id) return 1;
    return companyRelevanceScore(b)-companyRelevanceScore(a);
  });
}
function cleanReportTitle(src){
  if(!src) return state.naics ? state.naics.title : "Industry";
  return normText(src.title).replace(/^[A-Z0-9]{4,8}\s+/i,"").replace(/^\d{5,6}[A-Z]?\s+/i,"");
}
function analysisMarket(){ return cleanReportTitle(primaryIndustrySource()); }
function excerptAround(text, phrase, radius=220){
  const t = normText(text); const i = t.toLowerCase().indexOf((phrase||"").toLowerCase());
  if(i<0) return t.slice(0, Math.min(t.length, radius*2));
  const a=Math.max(0,i-radius), b=Math.min(t.length,i+(phrase||"").length+radius);
  return t.slice(a,b);
}
function excerptFrom(text, phrase, length=520){
  const t=normText(text); const i=t.toLowerCase().indexOf((phrase||"").toLowerCase());
  if(i<0) return t.slice(0,Math.min(t.length,length));
  return t.slice(i,Math.min(t.length,i+length));
}
function normalizeHorizon(h){
  const m = String(h||"").match(/(20\d{2})\s*-\s*(\d{2,4})/);
  if(!m) return String(h||"");
  let end=m[2]; if(end.length===2) end=m[1].slice(0,2)+end;
  return `${m[1]}–${end}`;
}
function candidateBase(src, pg, keyword, excerpt, fields={}, included=false, confidence="high", kind="fact"){
  return {id:uid(), sourceId:src.id, page:pg.num, keyword, excerpt:normText(excerpt).slice(0,520), included, fields, confidence, kind, warning:false, warningText:""};
}
function sourceIsPrimary(src){ const p=primaryIndustrySource(); return !!(p && src.id===p.id); }
/* ---- Competitor / market-share context classification ----
   Rather than assigning a percentage to a company from a single fixed
   regex, every percentage in a candidate sentence is scored against
   surrounding language: phrases that positively indicate market/industry
   share vs. phrases that indicate a different metric (same-store sales,
   revenue growth, margin, etc.). A percentage is only treated as market
   share when share-language sits close to it and no conflicting metric
   language sits closer; otherwise it is reported as unverifiable rather
   than guessed. */
const SHARE_POSITIVE_PHRASES = [
  "market share","industry share","share of the market","share of industry revenue",
  "share of total industry revenue","% of industry revenue","% of the market",
  "share of the industry","share of total revenue","of industry sales","of the u.s. market",
  "market-leading share","commands the largest share","leading share of","share of consumer spending"
];
const SHARE_NEGATIVE_PHRASES = [
  "same-store sales","same store sales","comparable sales","comp sales","comparable-store sales",
  "comparable restaurant sales","same-restaurant sales","revenue growth","sales growth",
  "yoy growth","year-over-year growth","profit margin","operating margin","gross margin",
  "net margin","ebitda margin","menu price increase","price increase","foot traffic",
  "unit growth","store count growth","guest traffic","transaction growth","annual growth rate",
  "cagr","forecast to grow","expected to grow","unemployment rate","tax rate","interest rate",
  "discount rate","same-store sales growth","comp-store sales","cost increase","wage increase"
];
const SHARE_LINK_VERBS = ["holds","holding","has","accounts for","commands","commanding","controls",
  "captures","maintains","represents","owns","claims","posts","reports","held","commanded","captured"];
const COMPETITIVE_CONTEXT_KEYWORDS = ["market share","leading company","largest player","top competitor",
  "industry leader","dominant player","market leader","major companies","competitive landscape",
  "leading companies","key competitor","primary competitor"];
const NAME_STOPWORDS = new Set(["The","This","That","These","Those","It","In","On","At","For","With",
  "According","Overall","However","Although","Meanwhile","Industry","Company","Companies","Overview",
  "Total","Estimated","Approximately","Currently","Additionally","Furthermore","Moreover","Therefore",
  "Despite","Across","Within","Between","Among","Some","Many","Most","Several","Other","Others","US",
  "United","North","Source","Figure","Table","Exhibit","IBISWorld","MarketResearch","Census"]);

function findAllPercents(text){
  const re = /(\d{1,3}(?:\.\d+)?)\s?%/g;
  const out = []; let m;
  while((m = re.exec(text))){ out.push({value:m[1], index:m.index, length:m[0].length}); }
  return out;
}
function findCompanyPhrases(text){
  const re = /\b([A-Z][A-Za-z&'.]+(?:\s+[A-Z][A-Za-z&'.]+){0,3})\b/g;
  const out = []; let m;
  while((m = re.exec(text))){
    const phrase = m[1].trim();
    const firstWord = phrase.split(" ")[0].replace(/[^A-Za-z]/g,"");
    if(NAME_STOPWORDS.has(firstWord)) continue;
    if(phrase.length<3 || phrase.length>40) continue;
    out.push({name:phrase, index:m.index});
  }
  return out;
}
function nearestPhrase(list, idx, maxDist){
  let best=null, bestDist=Infinity;
  for(const p of list){
    const d = Math.abs(p.index - idx);
    if(d<bestDist && d<=maxDist){ bestDist=d; best=p; }
  }
  return best;
}
function phraseNear(text, idx, phrases, windowChars){
  const start = Math.max(0, idx-windowChars), end = Math.min(text.length, idx+windowChars);
  const win = text.slice(start,end).toLowerCase();
  return phrases.filter(p=>win.includes(p));
}
function classifySharePercent(sentence, pct, companyPhrases){
  const idx = pct.index;
  const lower = sentence.toLowerCase();
  const negNear = phraseNear(sentence, idx, SHARE_NEGATIVE_PHRASES, 55);
  const posNear = phraseNear(sentence, idx, SHARE_POSITIVE_PHRASES, 65);
  const posAnywhere = SHARE_POSITIVE_PHRASES.filter(p=>lower.includes(p));
  const negAnywhere = SHARE_NEGATIVE_PHRASES.filter(p=>lower.includes(p));

  let type, confidence;
  if(negNear.length>0){ type = "other_metric"; confidence = "n/a"; }
  else if(posNear.length>0){ type = "market_share"; confidence = "high"; }
  else if(posAnywhere.length>0){ type = "market_share"; confidence = "medium"; }
  else { type = "ambiguous"; confidence = "low"; } // covers negAnywhere-but-not-near, and no signal at all

  const company = nearestPhrase(companyPhrases, idx, 90);
  let linked = false;
  if(company){
    const lo = Math.min(company.index, idx), hi = Math.max(company.index, idx);
    const between = sentence.slice(lo, hi).toLowerCase();
    linked = SHARE_LINK_VERBS.some(v=>between.includes(v));
  }
  if(type==="market_share"){
    if(!company){ confidence = "low"; }
    else if(!linked && confidence==="high"){ confidence = "medium"; }
    else if(!linked && confidence==="medium"){ confidence = "low"; }
  }
  return {type, confidence, company: company?company.name:null, linked};
}

function extractCompetitorCandidates(){
  const found = [];
  const seen = new Set();
  outer:
  for(const src of state.sources){
    for(const pg of src.pages){
      const sentences = splitSentences(pg.text);
      for(const sent of sentences){
        const lower = sent.toLowerCase();
        const hasContextKw = COMPETITIVE_CONTEXT_KEYWORDS.some(k=>lower.includes(k));
        const percents = findAllPercents(sent);
        const companyPhrases = findCompanyPhrases(sent);
        if(percents.length===0 && !hasContextKw) continue;

        if(percents.length>0){
          for(const pct of percents){
            const cls = classifySharePercent(sent, pct, companyPhrases);
            if(cls.type==="other_metric" && !hasContextKw) continue;
            const key = sent.slice(0,50)+"|"+pct.value;
            if(seen.has(key)) continue;
            seen.add(key);

            let shareStatus, shareValue, warning, warningText;
            if(cls.type==="market_share" && cls.confidence!=="low"){
              shareStatus = "verified"; shareValue = pct.value;
              warning = !cls.linked;
              warningText = !cls.linked ? "Percentage and company name were not explicitly linked by a phrase such as \u201cholds\u201d or \u201caccounts for\u201d \u2014 verify the connection against the excerpt." : "";
            } else {
              shareStatus = "unable"; shareValue = "";
              warning = true;
              warningText = cls.type==="other_metric"
                ? "This percentage appears to describe a different metric (sales growth, comparable-store sales, or margin), not market share."
                : "Surrounding text does not clearly indicate this percentage represents market, industry, or revenue share \u2014 review manually.";
            }

            found.push({
              id: uid(), sourceId: src.id, page: pg.num, keyword: "market-share-context",
              excerpt: sent.length>320 ? sent.slice(0,320)+"\u2026" : sent,
              included: shareStatus==="verified" && found.filter(f=>f.fields && f.fields.shareStatus==="verified").length<3,
              fields: { company: cls.company || "", share: shareValue, shareStatus, confidence: cls.confidence, year: yearGuess(sent) },
              warning, warningText
            });
            if(found.length>=10) continue outer;
          }
        } else if(hasContextKw){
          const key = sent.slice(0,50)+"|noPct";
          if(seen.has(key)) continue;
          seen.add(key);
          const company = companyPhrases[0];
          found.push({
            id: uid(), sourceId: src.id, page: pg.num, keyword: "competitive-context",
            excerpt: sent.length>320 ? sent.slice(0,320)+"\u2026" : sent,
            included: false,
            fields: { company: company?company.name:"", share:"", shareStatus:"unable", confidence:"low", year: yearGuess(sent) },
            warning: true, warningText: "No percentage found in this excerpt \u2014 competitive mention only, market share not stated."
          });
        }
      }
      if(found.length>=10) break outer;
    }
  }
  return found;
}

/* ============================= PDF / TXT EXTRACTION ============================= */
if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js";
}

async function extractPdf(file){
  const buf = await file.arrayBuffer();
  const doc = await pdfjsLib.getDocument({data:buf}).promise;
  const pages = [];
  for(let i=1;i<=doc.numPages;i++){
    const page = await doc.getPage(i);
    const content = await page.getTextContent();
    const text = content.items.map(it=>it.str).join(" ").replace(/\s+/g," ").trim();
    pages.push({num:i, text});
  }
  return pages;
}
async function extractTxt(file){
  const text = await file.text();
  // split into pseudo-pages of ~3500 chars so citations can still say "p. N" (approximate)
  const chunks = [];
  const size = 3500;
  for(let i=0;i<text.length;i+=size){
    chunks.push(text.slice(i, i+size));
  }
  return chunks.map((t,idx)=>({num:idx+1, text:t.replace(/\s+/g," ").trim()}));
}

async function handleFileUpload(file, category, publisherDefault){
  const isPdf = /\.pdf$/i.test(file.name);
  let pages = [];
  try{
    pages = isPdf ? await extractPdf(file) : await extractTxt(file);
  }catch(e){
    pages = [{num:1, text:""}];
  }
  const fullText = pages.map(p=>p.text).join("\n");
  const titleGuess = file.name.replace(/\.(pdf|txt)$/i,"").replace(/[_-]+/g," ").trim();
  const src = {
    id: "S"+(nextSourceNum++),
    title: titleGuess || file.name,
    publisher: publisherDefault,
    year: yearGuess(fullText) || yearGuess(file.name) || "",
    filename: file.name,
    type: category,
    category,
    url: "",
    pageCount: pages.length,
    pages,
    fullText
  };
  normalizeSourceMetadata(src);
  state.sources.push(src);
  return src;
}

/* ============================= NAICS DETERMINATION ============================= */
function findKeywordHit(text, kw){
  const idx = (text||"").toLowerCase().indexOf((kw||"").toLowerCase());
  if(idx===-1) return null;
  const start = Math.max(0, idx-140);
  const end = Math.min(text.length, idx+kw.length+220);
  return normText(text.slice(start,end));
}

function companyEvidencePages(){
  const terms = companyTerms();
  const out=[];
  for(const src of evidenceSources()){
    for(const pg of src.pages||[]){
      const l=normText(pg.text).toLowerCase();
      if(terms.some(t=>t && l.includes(t))) out.push({src,pg,text:normText(pg.text)});
    }
  }
  return out;
}
function findNaicsDefinitionCitation(code){
  const ref=NAICS_REF[code];
  for(const src of state.sources.filter(isNaicsSource)){
    for(const pg of src.pages||[]){
      const t=normText(pg.text), l=t.toLowerCase();
      const titleWords=ref.title.toLowerCase().replace(/-/g," ").split(/\s+/).filter(Boolean);
      const compact=l.replace(/-/g," ");
      const hasCode=l.includes(code);
      const hasTitle=titleWords.every(w=>compact.includes(w));
      if(hasCode && hasTitle){
        const excerpt=excerptAround(t, code, 320);
        return {sourceId:src.id,page:pg.num,excerpt,label:`[${src.id}, p. ${pg.num}]`};
      }
    }
  }
  return {sourceId:null,page:null,excerpt:ref.def,label:"[Built-in NAICS Reference Library — 2022 NAICS definition]"};
}
function findCompanyBusinessCitation(code){
  const ref=NAICS_REF[code];
  let best=null;
  for(const x of companyEvidencePages()){
    const l=x.text.toLowerCase();
    let score=0, hit="";
    for(const kw of ref.keywords){ if(l.includes(kw)){ score+=2; if(!hit) hit=kw; } }
    if(l.includes("description")) score+=1;
    if(sourceIsPrimary(x.src)) score+=4;
    if(score>0 && (!best || score>best.score)) best={...x,score,hit};
  }
  if(!best) return null;
  return {sourceId:best.src.id,page:best.pg.num,excerpt:excerptAround(best.text,best.hit||state.company,220),label:`[${best.src.id}, p. ${best.pg.num}]`};
}
function computeNaics(){
  // Critical safeguard: NAICS manuals are used only for the definition/citation.
  // Classification is scored from the analyst-supplied operating model plus pages that actually mention the focal company.
  const desc = normText(state.companyDescription).toLowerCase();
  const companyPages = companyEvidencePages();
  const scores={}, evidence={};
  for(const code in NAICS_REF){
    let score=0, hit="";
    for(const kw of NAICS_REF[code].keywords){
      const k=kw.toLowerCase();
      if(desc.includes(k)){ score+=5; if(!hit) hit=kw; }
      for(const x of companyPages){
        if(x.text.toLowerCase().includes(k)){ score += sourceIsPrimary(x.src)?3:1; if(!hit) hit=kw; }
      }
    }
    scores[code]=score; evidence[code]=hit;
  }
  const ranked=Object.keys(scores).sort((a,b)=>scores[b]-scores[a]);
  let top=ranked[0] || "722513";
  if(scores[top]===0) top="722513";
  // For restaurant concepts, 722511 is the most useful neighboring service-model comparison to 722513.
  let second = top==="722513" ? "722511" : (ranked.find(c=>c!==top) || "722513");
  const censusCitation=findNaicsDefinitionCitation(top);
  const neighborCitation=findNaicsDefinitionCitation(second);
  const businessCitation=findCompanyBusinessCitation(top);
  const definitionRationale = `${top} — ${NAICS_REF[top].title} covers ${NAICS_REF[top].def.charAt(0).toLowerCase()+NAICS_REF[top].def.slice(1)}`;
  const companyEvidenceStatement = businessCitation
    ? `${state.company||"The focal company"} is described in an uploaded company/industry source as a fast-casual restaurant concept, matching the Census definition's explicit inclusion of fast-casual restaurants.`
    : `The analyst-supplied operating model matches the Census service-model test for ${NAICS_REF[top].title}.`;
  const rationale = `${definitionRationale} ${companyEvidenceStatement}`;
  const rejection = `${second} — ${NAICS_REF[second].title} is not selected because ${NAICS_REF[second].def} That service model does not match the focal company's primary operating model.`;
  return {
    code:top, title:NAICS_REF[top].title, rationale, definitionRationale, companyEvidenceStatement,
    citation:censusCitation, businessCitation,
    neighborCode:second, neighborTitle:NAICS_REF[second].title,
    neighborRejection:rejection, neighborCitation,
    censusDef:NAICS_REF[top].def,
    methodNote:"NAICS source text is never used as evidence for regulation, supply chain, customers, trends, threats, or competitors."
  };
}

/* ============================= CANDIDATE EXTRACTION ============================= */
function splitSentences(text){
  return normText(text).split(/(?<=[.!?])\s+(?=[A-Z0-9])/).map(s=>s.trim()).filter(s=>s.length>30 && s.length<900);
}
function extractListedCompanies(src){
  const names=[];
  for(const pg of (src.pages||[]).slice(0,10)){
    const t=normText(pg.text);
    const m=t.match(/Companies\s+(.+?)(?:Accommodation and Food Services|Related Industries|Additional Resources|$)/i);
    if(!m) continue;
    const part=m[1];
    const pieces=part.split(/\s*•\s*/).map(x=>normText(x)).filter(Boolean);
    for(const x of pieces){
      const n=x.replace(/\s+(?:Accommodation|Related|Additional).*$/i,"").trim();
      if(n && n.length<=45 && !names.includes(n)) names.push(n);
    }
  }
  return names.slice(0,12);
}
function extractSizeAndGrowth(){
  const size=[], growth=[];
  let includedSize=false, includedGrowth=false;
  for(const src of orderedEvidenceSources()){
    for(const pg of src.pages||[]){
      const t=normText(pg.text);
      if(!/\bRevenue\b/i.test(t)) continue;
      const atGlance=/At a Glance/i.test(t) || /Performance Snapshot/i.test(t);
      if(!atGlance) continue;
      const rm=t.match(/\bRevenue\s+\$\s*([\d,.]+)\s*(bn|billion|m|million)\b/i);
      if(rm){
        const isPrimary=sourceIsPrimary(src);
        const unit=/^b/i.test(rm[2])?"billion (USD)":"million (USD)";
        size.push(candidateBase(src,pg,"industry revenue",excerptAround(t,rm[0],180),{amount:rm[1].replace(/,/g,""),unit,year:src.year||yearGuess(t)},isPrimary&&!includedSize,"high","fact"));
        if(isPrimary&&!includedSize) includedSize=true;
      }
      const region=t.slice(Math.max(0,t.toLowerCase().indexOf("revenue")), Math.min(t.length,(t.toLowerCase().indexOf("revenue")<0?0:t.toLowerCase().indexOf("revenue"))+420));
      const matches=[...region.matchAll(/(20\d{2}\s*-\s*(?:20)?\d{2})[^0-9%]{0,18}(\d+(?:\.\d+)?)\s*%/g)];
      if(matches.length){
        const candidates=matches.map(m=>({h:normalizeHorizon(m[1]),rate:m[2],raw:m[0]}));
        const sy=parseInt(src.year||"0",10);
        let chosen=candidates.find(x=>parseInt(x.h.slice(0,4),10)>=sy) || candidates[candidates.length-1];
        for(const x of candidates){
          const isPrimary=sourceIsPrimary(src), isChosen=x===chosen;
          growth.push(candidateBase(src,pg,"five-year CAGR",excerptAround(t,x.raw,180),{rate:x.rate,horizon:x.h,kind:(isChosen?"forecast":"historical")},isPrimary&&isChosen&&!includedGrowth,"high","fact"));
          if(isPrimary&&isChosen&&!includedGrowth) includedGrowth=true;
        }
      }
    }
  }
  return {size,growth};
}
function extractCompetitorCandidates(){
  const found=[]; const seen=new Set();
  for(const src of orderedEvidenceSources()){
    const names=extractListedCompanies(src);
    for(const pg of src.pages||[]){
      const t=normText(pg.text);
      if(!/Market Share/i.test(t)) continue;
      const strong=/Company Market Share \(%\)/i.test(t) || /Industry Market Share by Company/i.test(t);
      if(!strong) continue;
      for(const name of names){
        const re=new RegExp(`${escRe(name)}\\s+(\\d+(?:\\.\\d+)?(?:\\s*-\\s*\\d+(?:\\.\\d+)?)?)\\s+`,"i");
        const m=t.match(re); if(!m) continue;
        const key=name.toLowerCase(); if(seen.has(key)) continue; seen.add(key);
        const share=normText(m[1]);
        const isPrimary=sourceIsPrimary(src);
        found.push(candidateBase(src,pg,"company market share",excerptFrom(t,"Company Market Share (%)",620),{
          company:name,share,shareStatus:"verified",confidence:"high",year:src.year||yearGuess(t),estimate:share.includes("-")?"range":"point"
        },isPrimary && found.filter(x=>x.included).length<5,"high","fact"));
      }
    }
  }
  // Conservative fallback: surface possible competitive passages for manual review, but never auto-include them.
  if(found.length===0){
    for(const src of orderedEvidenceSources()) for(const pg of src.pages||[]){
      const t=normText(pg.text);
      if(/market share|major players|competitive landscape/i.test(t)){
        found.push(candidateBase(src,pg,"competitive context",excerptAround(t,"market share",250),{company:"",share:"",shareStatus:"unable",confidence:"low",year:src.year||""},false,"low","fact"));
        if(found.length>=5) return found;
      }
    }
  }
  return found;
}
function extractRegulatoryCandidates(){
  const out=[]; let included=0;
  for(const src of orderedEvidenceSources()) for(const pg of src.pages||[]){
    const t=normText(pg.text), l=t.toLowerCase();
    const section=l.includes("regulation & policy") || l.includes("regulation and policy");
    if(!section) continue;
    const isPrimary=sourceIsPrimary(src);
    if(l.includes("fda food code") || l.includes("food handling")){

    }
    if(l.includes("minimum wage") || l.includes("benefits rules")){

  return out;
}
function extractSupplyCandidates(){

    if(l.includes("supply chain") && l.includes("beef & pork") && l.includes("fruit & vegetable")){

    }

}
function extractCustomerCandidates(){
  const out=[]; let included=false;
  for(const src of orderedEvidenceSources()) for(const pg of src.pages||[]){
    const t=normText(pg.text), l=t.toLowerCase();
    if(!l.includes("major markets segmentation")) continue;
    const vals=[...t.matchAll(/\$[\d,.]+(?:bn|m)?\)?\s+(\d+(?:\.\d+)?)%/gi)].map(m=>parseFloat(m[1])).filter(Number.isFinite);
    const max=vals.length?Math.max(...vals):null;
    const isPrimary=sourceIsPrimary(src);
    const label=max!==null ? `Fragmented across income groups; largest segment is ${max.toFixed(1)}% of industry revenue` : "Customers are segmented across multiple income groups";
    out.push(candidateBase(src,pg,"major markets segmentation",excerptAround(t,"Major Markets Segmentation",330),{label,structure:"Fragmented",largestShare:max!==null?max.toFixed(1)+"%":"",why:"No single income segment represents a majority of industry revenue, indicating a broad consumer base rather than dependence on a concentrated buyer."},isPrimary&&!included,"high","interp"));
    if(isPrimary&&!included) included=true;
  }
  return out;
}
function extractTrendCandidates(){
  const out=[]; let included=false;
  for(const src of orderedEvidenceSources()) for(const pg of src.pages||[]){
    const t=normText(pg.text), l=t.toLowerCase();
    if(!l.includes("outlook")) continue;
    const marker="what's driving the industry outlook?";
    let label="";
    const idx=l.indexOf(marker);
    if(idx>=0){
      const rest=t.slice(idx+marker.length).trim();
      const bullet=rest.indexOf("•");
      label=normText(bullet>=0?rest.slice(0,bullet):rest.slice(0,150));
    }
    if(!label && l.includes("fast-casual") && l.includes("full-service")) label="Fast-casual restaurants gaining ground on full-service dining";
    if(!label) continue;
    const isPrimary=sourceIsPrimary(src);
    out.push(candidateBase(src,pg,"industry outlook",excerptFrom(t,label,620),{label,why:"The forward-looking outlook ties consumer demand to faster service, quality and value, favoring fast-casual formats over the next five years."},isPrimary&&!included,"high","fact"));
    if(isPrimary&&!included) included=true;
  }
  return out;
}
function extractThreatCandidates(){
  const out=[];
  for(const src of orderedEvidenceSources()) for(const pg of src.pages||[]){
    const t=normText(pg.text), l=t.toLowerCase();
    let score=0;
    if(l.includes("tariff")) score+=3;
    if(l.includes("ingredient") || l.includes("purchase costs")) score+=2;
    if(l.includes("profitability") || l.includes("margin pressure") || l.includes("bottom line")) score+=2;
    if(l.includes("price volatility")) score+=3;
    if(l.includes("supply chain")) score+=2;
    if(l.includes("mexico supplies") || l.includes("tomato imports") || l.includes("avocado")) score+=2;
    if(score<6) continue;
    const phrase=l.includes("price volatility")?"price volatility":(l.includes("tariffs")?"tariffs":"ingredient");
    const cand=candidateBase(src,pg,"cost / supply threat",excerptFrom(t,phrase,650),{
      label:"Ingredient-cost and supply-chain volatility, especially tariff exposure on imported inputs",
      why:"The cited report connects tariffs, volatile produce/input prices and logistics shocks to menu-price increases, weaker demand and lower profitability.",
      evidenceScore:score
    },false,"high","interp");
    out.push(cand);
  }
  const primary=out.filter(x=>{const s=state.sources.find(z=>z.id===x.sourceId); return s&&sourceIsPrimary(s);}).sort((a,b)=>(b.fields.evidenceScore||0)-(a.fields.evidenceScore||0));
  if(primary[0]) primary[0].included=true;
  return out.sort((a,b)=>(b.included-a.included)||((b.fields.evidenceScore||0)-(a.fields.evidenceScore||0))).slice(0,6);
}
function extractFallback(sig){
  const found=[];
  for(const src of orderedEvidenceSources()) for(const pg of src.pages||[]){
    const sentences=splitSentences(pg.text);
    for(const sent of sentences){
      const lower=sent.toLowerCase();
      const kw=sig.keywords.find(k=>lower.includes(k));
      if(!kw) continue;
      const c=candidateBase(src,pg,kw,sent,{label:kw},false,"low","fact");
      c.warning=true; c.warningText="Keyword match only — not auto-included. Confirm that the passage directly supports this signal before using it.";
      found.push(c); if(found.length>=5) return found;
    }
  }
  return found;
}
function extractCandidates(){
  const sg=extractSizeAndGrowth();
  const out={
    size:sg.size,
    growth:sg.growth,
    competitors:extractCompetitorCandidates(),
    regulatory:extractRegulatoryCandidates(),
    supply:extractSupplyCandidates(),
    customer:extractCustomerCandidates(),
    trend:extractTrendCandidates(),
    threat:extractThreatCandidates()
  };
  for(const sig of SIGNALS){ if((out[sig.key]||[]).length===0) out[sig.key]=extractFallback(sig); }
  return out;
}

/* ============================= GAP DETECTION ============================= */
function autoGaps(){
  const gaps=[]; const c=state.candidates||{};
  const included=(k)=>(c[k]||[]).filter(x=>x.included);
  if(included("size").length===0) gaps.push({missing:"Current industry revenue / market size",why:"No directly relevant industry-size evidence was confirmed.",resolve:"Upload or select an industry overview / At a Glance page with total industry revenue."});
  if(included("growth").length===0) gaps.push({missing:"Five-year growth trajectory",why:"No confirmed five-year CAGR or outlook rate was selected.",resolve:"Use an industry Performance or Outlook section with a stated five-year CAGR."});
  const brand=(companyTerms()[1]||companyTerms()[0]||"").toLowerCase();
  const rivals=included("competitors").filter(x=>!(x.fields.company||"").toLowerCase().includes(brand));
  const rivalCount=rivals.length;
  if(rivalCount<3) gaps.push({missing:"Three to five named competitors with market-share estimates",why:`Only ${rivalCount} confirmed competitor market-share row(s), excluding the focal company, are selected.`,resolve:"Use an IBISWorld/MarketResearch Major Players or Company Market Share table, or add chart/table evidence manually."});
  else {
    const ranged=rivals.filter(x=>/[–—-]/.test(x.fields.share||""));
    if(ranged.length){
      const names=ranged.map(x=>x.fields.company).filter(Boolean).join(", ");
      gaps.push({missing:"Exact point estimates for smaller competitor market shares",why:`The uploaded industry report gives ${names} as market-share ranges rather than exact percentages. The required competitor estimates are present, but exact point shares could not be established from the uploaded PDFs.`,resolve:"Use the full interactive IBISWorld Company Market Share data or another source reporting exact industry-specific revenue/share for those competitors."});
    }
  }
  if(included("regulatory").length===0) gaps.push({missing:"Specific regulatory/compliance pressures",why:"No relevant regulation section was confirmed.",resolve:"Use the industry Regulation & Policy section or a directly relevant filing/regulatory source."});
  if(included("supply").length===0) gaps.push({missing:"Supply-chain concentration or fragility",why:"No supply-chain or supplier-power evidence was confirmed.",resolve:"Use a Supply Chain / Buyer & Supplier Power section with named upstream industries and disruption evidence."});
  if(included("customer").length===0) gaps.push({missing:"Customer concentration or fragmentation",why:"No market-segmentation evidence was confirmed.",resolve:"Use a Major Markets / customer segmentation table that quantifies the customer base."});
  if(included("trend").length===0) gaps.push({missing:"Biggest five-year trend",why:"No forward-looking Outlook evidence was confirmed.",resolve:"Use a five-year Outlook section and identify the central forward-looking trend."});
  if(included("threat").length===0) gaps.push({missing:"Biggest threat",why:"No evidence-based threat interpretation was confirmed.",resolve:"Use passages explicitly connecting a risk/headwind to demand, costs, margins or industry performance."});
  return gaps;
}

/* ============================= RENDER ============================= */
const app = document.getElementById("app");

function setStep(n){
  if(n>0 && state.sources.length===0 && n>=3){ /* still allow navigation, just warn softly */ }
  state.step = n;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function stepAvailable(n){
  if(n<=2) return true;
  if(n===3) return state.sources.length>0 || state.naics!==null;
  if(n>=4) return state.candidates!==null;
  return true;
}

function render(){
  app.innerHTML = `
    ${renderMasthead()}
    ${renderStepper()}
    <div>${renderStepBody()}</div>
  `;
  wireEvents();
}

function renderMasthead(){
  return `
  <div class="masthead">
    <div class="brand">
      <div class="brand-mark">IIP</div>
      <div>
        <h1>Industry Intelligence Pipeline</h1>
        <p>Structured, source-traced industry briefs from your uploaded research — nothing asserted without a citation.</p>
      </div>
    </div>
    <button class="btn ghost no-print" id="themeToggle" type="button">Toggle theme</button>
  </div>`;
}

function renderStepper(){
  return `<div class="stepper no-print">
    ${STEPS.map((label,i)=>{
      const active = i===state.step;
      const done = i<state.step;
      const disabled = !stepAvailable(i) && i>state.step;
      return `<button class="step-btn ${active?"active":""} ${done?"done":""}" data-step="${i}" ${disabled?"disabled":""}>
        <span class="n">STEP ${i+1}</span><span class="t">${label}</span>
      </button>`;
    }).join("")}
  </div>`;
}

function renderStepBody(){
  switch(state.step){
    case 0: return stepCompany();
    case 1: return stepNaics();
    case 2: return stepSources();
    case 3: return stepAnalyze();
    case 4: return stepBrief();
    case 5: return stepExport();
    default: return "";
  }
}

/* ---------- STEP 3: Analyze ---------- */
function stepAnalyze(){
  if(!state.candidates){
    return `
    <div class="card">
      <span class="section-label">Step 3</span>
      <h2>Ready to analyze ${state.sources.length} source${state.sources.length===1?"":"s"}</h2>
      <p class="desc">The pipeline scans every uploaded page for evidence tied to seven required signals. Nothing is included in the brief unless it is backed by a real excerpt you can review below.</p>
      <div class="btn-row">
        <button class="btn big" id="generateBtn" type="button">Generate Industry Brief</button>
      </div>
    </div>
    <div class="btn-row"><button class="btn ghost" data-nav="2" type="button">← Back</button></div>`;
  }
  const totalIncluded = SIGNALS.reduce((a,s)=>a+state.candidates[s.key].filter(c=>c.included).length,0);
  return `
  <div class="card">
    <span class="section-label">Step 3</span>
    <h2>Review extracted evidence</h2>

function renderSignalBlock(sig){
  const list = state.candidates[sig.key];
  return `<div class="card">
    <span class="section-label">${sig.label}</span>
    ${list.length===0 ? `<p class="no-candidates">Not found in uploaded sources — no matching evidence detected. This will appear in Evidence Gaps.</p>` :
      list.map(c=>renderCandidate(sig, c)).join("")}
    <button class="btn ghost addCandidate" data-sig="${sig.key}" type="button" style="margin-top:6px;">+ Add manual note with citation</button>
  </div>`;
}

function extraFieldsHtml(sig, c){
  if(sig.key==="size") return `<div class="fields"><div><label>Amount</label><input type="text" data-f="amount" value="${esc(c.fields.amount||"")}"/></div><div><label>Unit</label><input type="text" data-f="unit" value="${esc(c.fields.unit||"")}"/></div><div><label>Year</label><input type="text" data-f="year" value="${esc(c.fields.year||"")}"/></div></div>`;
  if(sig.key==="growth") return `<div class="fields"><div><label>Growth rate (%)</label><input type="text" data-f="rate" value="${esc(c.fields.rate||"")}"/></div><div><label>Horizon</label><input type="text" data-f="horizon" value="${esc(c.fields.horizon||"")}"/></div></div>`;
  if(sig.key==="competitors") return `<div class="fields"><div><label>Company</label><input type="text" data-f="company" value="${esc(c.fields.company||"")}"/></div><div><label>Market-share estimate (%)</label><input type="text" data-f="share" value="${esc(c.fields.shareStatus==='verified'?(c.fields.share||''):'')}" placeholder="e.g. 12.2 or 0–2.5"/></div><div><label>Year</label><input type="text" data-f="year" value="${esc(c.fields.year||"")}"/></div><div><label>Confidence</label><input type="text" data-f="confidence" value="${esc(c.fields.confidence||c.confidence||"")}" readonly/></div></div>${c.warning?`<p class="small" style="color:var(--red);margin-top:6px;">⚠ ${esc(c.warningText||"")}</p>`:""}`;
  if(sig.key==="regulatory") return `<div class="fields"><div><label>Pressure</label><input type="text" data-f="label" value="${esc(c.fields.label||"")}"/></div><div><label>Direction</label><input type="text" data-f="direction" value="${esc(c.fields.direction||"")}"/></div></div>`;
  return `<div class="fields"><div><label>Conclusion / label</label><input type="text" data-f="label" value="${esc(c.fields.label||"")}"/></div>${c.fields.assessment!==undefined?`<div><label>Assessment</label><input type="text" data-f="assessment" value="${esc(c.fields.assessment||"")}"/></div>`:""}</div>`;
}
function manualEvidenceEditor(c){
  return `<div class="fields" style="margin-top:10px;">
    <div><label>Source</label><select class="manualSrc">${state.sources.map(s=>`<option value="${esc(s.id)}" ${s.id===c.sourceId?"selected":""}>${esc(s.id)} — ${esc(s.title)}</option>`).join("")}</select></div>
    <div><label>Page</label><input type="number" min="1" class="manualPage" value="${c.page||1}"/></div>
  </div><label class="field-label" style="margin-top:8px;">Exact supporting excerpt / chart-table note</label><textarea class="manualExcerpt">${esc(c.excerpt||"")}</textarea>`;
}
function renderCandidate(sig, c){
  const src=state.sources.find(s=>s.id===c.sourceId);
  const quality=c.confidence||c.fields.confidence||"medium";
  const kind=c.kind||"fact";
  return `<div class="candidate" data-cid="${c.id}" data-sigkey="${sig.key}">
    <div class="head"><label class="chk"><input type="checkbox" class="candChk" ${c.included?"checked":""}/> ${c.manual?"Manual evidence":esc(c.excerpt.slice(0,72))+(c.excerpt.length>72?"…":"")}</label>
    <span style="display:flex;gap:6px;align-items:center;">${c.warning?`<span class="tag gap" title="${esc(c.warningText||"")}">⚠ review</span>`:""}<span class="tag ${kind==='interp'?'interp':'fact'}">${kind==='interp'?'interpretation':'source fact'}</span><span class="badge outline">[${esc(c.sourceId)}, p. ${c.page}]</span></span></div>
    ${c.manual?manualEvidenceEditor(c):`<div class="excerpt">${esc(c.excerpt)}</div>`}
    ${extraFieldsHtml(sig,c)}
    ${c.fields.why?`<p class="small"><b>Why it supports this signal:</b> ${esc(c.fields.why)}</p>`:""}
    <p class="small">Source: ${esc(src?src.title:c.sourceId)} · evidence quality: ${esc(quality)} · ${c.manual?"manual chart/table/text evidence":"matched “"+esc(c.keyword)+"”"}</p>
  </div>`;
}

/* ---------- STEP 4: Brief ---------- */

  const c = state.candidates;
  const included = key => c[key].filter(x=>x.included);

  const sizeItems = included("size");
  const growthItems = included("growth");
  const compItems = included("competitors");
  const regItems = included("regulatory");
  const supplyItems = included("supply");
  const custItems = included("customer");
  const trendItems = included("trend");
  const threatItems = included("threat");

  return `
  <div class="card" id="briefRoot">
    <div class="brief-header">
      <div class="co">Industry Intelligence Brief</div>
      <div class="meta">
        <b>Company:</b> ${esc(state.company)} &nbsp;·&nbsp;
        <b>Competitive market:</b> ${esc(analysisMarket())} &nbsp;·&nbsp;
        <b>NAICS:</b> ${esc(state.naics.code)} — ${esc(state.naics.title)} &nbsp;·&nbsp;
        <b>Analysis date:</b> ${state.briefDate}

      ${execCard("Industry size", sizeItems[0] ? fmtSize(sizeItems[0]) : "Not found in uploaded sources", sizeItems[0])}
      ${execCard("5-year growth", growthItems[0] ? fmtGrowth(growthItems[0]) : "Not found in uploaded sources", growthItems[0])}
      ${execCard("Market leader", compItems[0] ? (compItems[0].fields.company||"Not identified") + (compItems[0].fields.shareStatus==="verified" && compItems[0].fields.share?` — ${compItems[0].fields.share}%`:" — share unverified") : "Not found in uploaded sources", compItems[0])}
      ${execCard("Supply-chain pressure", supplyItems.length? supplyAssessment(supplyItems).level : "Not found in uploaded sources", supplyItems[0])}
      ${execCard("Customer structure", custItems[0] ? custItems[0].fields.label : "Not found in uploaded sources", custItems[0])}
      ${execCard("Biggest trend", trendItems[0] ? trendItems[0].fields.label : "Not found in uploaded sources", trendItems[0])}
      ${execCard("Biggest threat", threatItems[0] ? threatItems[0].fields.label : "Not found in uploaded sources", threatItems[0])}
    </div>

    <h3>NAICS Classification</h3>
    <p><b>${esc(state.naics.code)}</b> — ${esc(state.naics.title)}</p>
    <p class="small"><b>Census definition:</b> ${esc(state.naics.definitionRationale||state.naics.censusDef)} ${citeBadge(state.naics.citation)}</p>
    <p class="small"><b>Company evidence:</b> ${esc(state.naics.companyEvidenceStatement||"")} ${state.naics.businessCitation?citeBadge(state.naics.businessCitation):""}</p>
    <p><b>Neighboring code considered:</b> ${esc(state.naics.neighborCode)} — ${esc(state.naics.neighborTitle)} ${citeBadge(state.naics.neighborCitation)}</p>
    <p class="small">${esc(state.naics.neighborRejection)}</p>

    <h3>1. Industry Size &amp; Growth</h3>
    ${renderSizeGrowthTable(sizeItems, growthItems)}

    <h3>2. Competitive Landscape</h3>
    ${renderCompetitorTable(compItems)}

    <h3>3. Regulatory &amp; Compliance Pressure</h3>
    ${renderQualTable(regItems, ["label","direction"], ["Pressure","Direction"])}

    <h3>4. Supply Chain</h3>
    ${renderSupplyChain(supplyItems)}

    <h3>5. Customer Structure</h3>
    ${renderQualTable(custItems, ["label"], ["Customer signal"])}

    <h3>6. Biggest Five-Year Trend</h3>
    ${renderSingleQual(trendItems)}

    <h3>7. Biggest Threat</h3>
    ${renderSingleQual(threatItems)}

    <h3>Evidence Gaps &amp; Limitations</h3>
    ${renderGapsTable(gaps)}
    <div class="btn-row no-print">
      <input type="text" id="newGapMissing" placeholder="Missing information" style="max-width:220px;"/>
      <input type="text" id="newGapWhy" placeholder="Why it could not be determined" style="max-width:260px;"/>
      <input type="text" id="newGapResolve" placeholder="What would resolve it" style="max-width:220px;"/>
      <button class="btn ghost" id="addGapBtn" type="button">+ Add row</button>
    </div>

    <h3>Sources</h3>
    ${renderSourceRegister()}

    <h3>Methodology</h3>
    <p class="small">
      <b>1. NAICS classification</b> — the company's operating model and company-specific pages are compared with Census definitions. Census/NAICS documents are definition sources only; they are excluded from every other industry signal.<br/>
      <b>2. Market scope</b> — the tool prioritizes the uploaded industry report that most directly covers the focal company. The competitive market can therefore differ from the company's establishment-level NAICS classification.<br/>
      <b>3. Evidence extraction</b> — high-confidence extraction uses report structure (At a Glance, Company Market Share, Major Markets, Regulation & Policy, Buyer & Supplier Power, and Outlook) rather than isolated keywords. Keyword-only matches remain unchecked for analyst review.<br/>
      <b>4. Charts and tables</b> — text-layer tables are parsed when possible. If a chart is not machine-readable, the analyst can add a manual evidence row with source, page, exact chart/table note, and the value shown.<br/>
      <b>5. Interpretation</b> — source facts and analyst interpretations are labeled separately. Trend and threat conclusions must be tied to a cited forward-looking or risk passage; the tool does not fill missing evidence with a guess.<br/>
      <b>6. Evidence gaps</b> — the brief flags any missing required signal, including fewer than three named competitors with market-share estimates.
    </p>
    <p class="tag interp">Evidence labels: <span class="tag fact">source fact</span> = directly stated in a cited source; <span class="tag interp">interpretation</span> = analyst synthesis that is explicitly grounded in the cited evidence.</p>
